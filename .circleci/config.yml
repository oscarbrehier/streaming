version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - checkout

      - run:
          name: Install Docker (if missing)
          command: |
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o install-docker.sh
              sudo sh install-docker.sh
            fi

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - run:
          name: Build and Push Docker Image
          command: |
            IMAGE_TAG="${DOCKER_USERNAME}/streaming-web:${CIRCLE_SHA1}"
            IMAGE_LATEST="${DOCKER_USERNAME}/streaming-web:latest"
            
            export DOCKER_BUILDKIT=1
            
            docker build \
              --cache-from ${IMAGE_LATEST} \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --build-arg TMDB_READ_TOKEN="$TMDB_READ_TOKEN" \
              --build-arg TMDB_API_KEY="$TMDB_API_KEY" \
              --build-arg SUPABASE_URL="$SUPABASE_URL" \
              --build-arg SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              --build-arg SUPABASE_SERVICE_ROLE_SECRET="$SUPABASE_SERVICE_ROLE_SECRET" \
              -t ${IMAGE_TAG} \
              -t ${IMAGE_LATEST} \
              .
            
            docker push ${IMAGE_TAG}
            docker push ${IMAGE_LATEST}

  deploy:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - run:
          name: Deploy to Server
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} \
              "cd ~/streaming && \
               DOCKER_USERNAME=${DOCKER_USERNAME} IMAGE_TAG=${CIRCLE_SHA1} docker compose pull nextapp && \
               DOCKER_USERNAME=${DOCKER_USERNAME} IMAGE_TAG=${CIRCLE_SHA1} docker compose up -d --no-build --remove-orphans --force-recreate nextapp"

      - run:
          name: Verify Deployment
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} \
              "docker ps --filter name=streaming_nextapp --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'"

      - run:
          name: Cleanup Old Images
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} \
              "docker image prune -af --filter 'until=48h'"

      - run:
          name: Check Container Logs (if needed)
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} \
              "cd ~/streaming && docker compose logs --tail=50 nextapp"
          when: on_fail

workflows:
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - develop
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main