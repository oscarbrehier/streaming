version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pnpm-store-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-store-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Build project
          command: pnpm run build
      - save_cache:
          key: v1-pnpm-store-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
            - .next/cache
      - run:
          name: Run tests
          command: npm test || echo "No tests found"
      - persist_to_workspace:
          root: ~/repo
          paths:
            - .next
            - node_modules
            - package.json
            - pnpm-lock.yaml
            - public
            - next.config.ts
            - components.json
            - tsconfig.json

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: ~/repo
      - add_ssh_keys
      - run:
          name: Deploy to VPS
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "mkdir -p ~/streaming"

            cd ~/repo
            tar czf deploy.tar.gz .next node_modules package.json package-lock.json public next.config.ts components.json tsconfig.json

            scp -o StrictHostKeyChecking=no deploy.tar.gz deployer@${SERVER_IP}:~/streaming/

            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "
              cd ~/streaming
              tar xzf deploy.tar.gz
              rm deploy.tar.gz
              pm2 restart streaming || pm2 start pnpm --name streaming --cwd ~/streaming -- start
            "

workflows:
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
