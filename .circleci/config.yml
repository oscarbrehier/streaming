version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - checkout

      - run:
          name: Install Node & Docker
          command: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o install-docker.sh
              sudo sh install-docker.sh
            fi

      - run: npm ci

      - run:
          name: Build Docker image
          command: |
            docker build \
              --build-arg TMDB_READ_TOKEN="$TMDB_READ_TOKEN" \
              --build-arg TMDB_API_KEY="$TMDB_API_KEY" \
              --build-arg SUPABASE_URL="$SUPABASE_URL" \
              --build-arg SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              --build-arg SUPABASE_SERVICE_ROLE_SECRET="$SUPABASE_SERVICE_ROLE_SECRET" \
              -t streaming-web .

      - run: docker save streaming-web | gzip > streaming-web.tar.gz

      - persist_to_workspace:
          root: .
          paths:
            - streaming-web.tar.gz

  deploy:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Install Docker (if missing)
          command: |
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o install-docker.sh
              sudo sh install-docker.sh
            fi

      - run:
          name: Upload image to server
          command: |
            scp -o StrictHostKeyChecking=no streaming-web.tar.gz deployer@${SERVER_IP}:~/streaming/

      - run:
          name: Load image on server
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} \
              "cd ~/streaming && gunzip -f streaming-web.tar.gz && docker load < streaming-web.tar"

      - run:
          name: Restart docker compose
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} \
              "cd ~/streaming && docker-compose down && docker-compose up -d --build --remove-orphans"

      - run:
          name: Verify containers
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "docker ps"

workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
