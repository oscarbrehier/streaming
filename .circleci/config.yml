version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Build project
          command: npm run build
      - run:
          name: Run tests
          command: npm test || echo "No tests found"
      - persist_to_workspace:
          root: ~/repo
          paths:
            - .next
            - node_modules
            - package.json
            - package-lock.json
            - public
            - next.config.ts
            - components.json
            - tsconfig.json

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - attach_workspace:
          at: ~/repo
      - add_ssh_keys
      - run:
          name: Deploy to VPS
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "mkdir -p ~/streaming"

            rsync -avz --delete \
              -e "ssh -o StrictHostKeyChecking=no" \
              ~/repo/.next \
              ~/repo/node_modules \
              ~/repo/package.json \
              ~/repo/package-lock.json \
              ~/repo/public \
              ~/repo/next.config.ts \
              ~/repo/components.json \
              ~/repo/tsconfig.json \
              deployer@${SERVER_IP}:~/streaming/

            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "
              cd ~/streaming
              pm2 restart streaming || pm2 start npm --name streaming --cwd ~/streaming -- start
            "

workflows:
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
