version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build project
          command: |
            export NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL
            export NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
            export SUPABASE_SERVICE_ROLE_SECRET=$SUPABASE_SERVICE_ROLE_SECRET
            npm run build

  deploy:
    executor: node-executor
    steps:
      - add_ssh_keys
      - run:
          name: Verify SSH connection
          command: ssh -o StrictHostKeyChecking=no deployer@$SERVER_IP "echo 'SSH connection successful'"
      - run:
          name: Deploy to VPS
          command: |
            ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "\
              git clone https://github.com/oscarbrehier/streaming.git ~/streaming; && \
              fi && \
              cd ~/streaming && \
              echo 'Pulling latest changes...' && \
              git pull origin main && \
              echo 'Installing dependencies...' && \
              npm ci && \
              echo 'Building project...' && \
              npm run build && \
              echo 'Restarting PM2 process...' && \
              (pm2 describe streaming > /dev/null 2>&1 && pm2 restart streaming || pm2 start dist/src/server.js --name streaming) && \
              pm2 save \
            "

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
