version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout

      - run: npm ci

      - run: |
          docker build \
            --build-arg TMDB_READ_TOKEN="$TMDB_READ_TOKEN" \
            --build-arg TMDB_API_KEY="$TMDB_API_KEY" \
            --build-arg SUPABASE_URL="$SUPABASE_URL" \
            --build-arg SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-arg SUPABASE_SERVICE_ROLE_SECRET="$SUPABASE_SERVICE_ROLE_SECRET" \
            -t streaming-web .

      - run: docker save streaming-web | gzip > streaming-web.tar.gz

      - persist_to_workspace:
          root: .
          paths:
            - streaming-web.tar.gz

  deploy:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - attach_workspace:
          at: .

      - run: scp -o StrictHostKeyChecking=no streaming-web.tar.gz deployer@${SERVER_IP}:~/streaming/

      - run: ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "cd ~/streaming && gunzip -f streaming-web.tar.gz"

      - run: ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "cd ~/streaming && docker load < streaming-web.tar"

      - run: ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "cd ~/streaming && docker-compose down"

      - run: ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "cd ~/streaming && docker-compose up -d --build --remove-orphans"

      - run: ssh -o StrictHostKeyChecking=no deployer@${SERVER_IP} "docker ps"

workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
