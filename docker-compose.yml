version: '3.9'

services:
  nextapp:
    image: ${DOCKER_USERNAME}/streaming-web:${IMAGE_TAG:-latest}
    container_name: streaming_nextapp
    env_file:
      - .env.production
    restart: always
    expose:
      - "3005"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/streaming.eggspank.cloud/fullchain.pem:/etc/ssl/certs/nginx.crt:ro
      - /etc/letsencrypt/live/streaming.eggspank.cloud/privkey.pem:/etc/ssl/private/nginx.key:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nextapp
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge